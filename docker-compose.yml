services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: uinventario
      MYSQL_USER: uinventario
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-only-change-me}
    ports:
      - '3307:3306'
    volumes:
      - uinventario_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -p"$${MYSQL_ROOT_PASSWORD}"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  uinventario_mysql:
