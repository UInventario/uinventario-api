name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root@127.0.0.1:3306/uinventario
      DB_MIGRATIONS_RUN: 'true'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: uinventario
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate recovery tooling
        run: |
          python3 -m py_compile deploy/database-backup.py
          sh -n deploy/provision-database-backups.sh
          sh -n deploy/database-backup-jobs.sh
          sh -n deploy/configure-cloud-build.sh
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Contract tests
        run: npm run test:contracts
      - name: Build
        run: npm run build
      - name: Enforce expand-contract migrations
        run: npm run migration:compatibility
      - name: Checkout N-1 schema
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v1.0.0
          path: .ci/n-minus-one
      - name: Install N-1 locked dependencies
        working-directory: .ci/n-minus-one
        run: npm ci
      - name: Apply N-1 migrations
        working-directory: .ci/n-minus-one
        run: npm run migration:run
      - name: Upgrade N-1 to current and verify retry
        run: |
          npm run migration:run
          npm run migration:run
      - name: Integration tests
        run: npm run test:e2e:ci
